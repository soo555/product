<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company Products</title>
<link rel="stylesheet" href="product.css">
</head>
<body>
<h2> Sama Osama 23101571</h2>
<h3>Company Products</h3>
<div id="products"></div>
<button onclick="addProduct()">Add New Product</button>
<button onclick="deleteProduct()">Delete Product</button>
<script>

let products = [

  {name: "Laptop", id: "P101", price: 1500, img: "laptop.jpg"},

  {name: "Phone", id: "P102", price: 800, img: "iphone.jfif"},

  {name: "Tablet", id: "P103", price: 600, img: "unnamed.png"},

  {name: "Headphones", id: "P104", price: 150, img: "headphone.webp"},

  {name: "Smart Watch", id: "P105", price: 250, img: "smartwatch.jpg"},

];

function displayProducts() {

  let container = document.getElementById("products");

  container.innerHTML = "";

  for (let p of products) {

    container.innerHTML += `
<div class="product">
<img src="${p.img}" alt="${p.name}">
<p><b>${p.name}</b></p>
<p>ID: ${p.id}</p>
<p>Price: $${p.price}</p>
</div>`;

  }

}

function addProduct() {

  let name = prompt("Enter product name:");

  let id = prompt("Enter product ID:");

  let price = prompt("Enter product price:");

  let img = prompt("Enter image URL (optional):");

  if (!name || !id || !price) {

    alert("Please enter all required fields!");

    return;

  }

  products.push({name, id, price, img: img || "https://via.placeholder.com/100"});

  displayProducts();

}

function deleteProduct() {

  let id = prompt("Enter product ID to delete:");

  products = products.filter(p => p.id !== id);

  displayProducts();

}

displayProducts();
 
</script>
</body>
</html>
